<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Confirmed</title>

  <link href="https://fonts.googleapis.com/css?family=Rubik" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Rubik', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #28a745;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 15px;
      background-color: #ff6b6b;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🎉 Order Confirmed!</h1>
    <p>Your burger is being prepared 🍔</p>
    <a href="index.html">Go Back</a>
  </div>

</body>
</html>
